name: Release Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: internal/frontend/package.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS Desktop App
        run: |
          wails build -platform darwin/${{ matrix.arch }} -trimpath

      - name: Package App (.zip)
        run: |
          cd build/bin
          zip -r "Mo_darwin_${{ matrix.arch }}.zip" Mo.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mo-darwin-${{ matrix.arch }}
          path: build/bin/Mo_darwin_${{ matrix.arch }}.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/Mo_darwin_${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
